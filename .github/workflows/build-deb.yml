name: Build KZTheme DEB
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['.ci/build-request']
permissions:
  contents: write
concurrency:
  group: kztheme-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib, os
          version=next(s.split(':',1)[1].strip() for s in Path('control').read_text().splitlines() if s.startswith('Version:'))
          assert version==Path('VERSION.txt').read_text().strip()
          for p in Path('.').rglob('*.plist'):
              if '.git' not in p.parts: plistlib.loads(p.read_bytes())
          theme=Path('layout/Library/Application Support/KZTheme')
          for n in ['lead.caml','min.caml','eye/sharingan.png','eye/dot.png']:
              assert (theme/n).is_file(), n
          for s in 'ABC':
              for i in (1,2,3):
                  assert (theme/f'cd/{s}/{i}.png').is_file()
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DELIVERY_VERSION='+version+'\n')
          PY
      - name: Install build dependencies
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          brew install ldid xz dpkg
          if ! find "$HOME/theos/sdks" -maxdepth 1 -name '*.sdk' -type d | grep -q .; then
            git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
            cp -R "$RUNNER_TEMP/theos-sdks/"*.sdk "$HOME/theos/sdks/"
          fi
      - name: Compile DEB
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build-output.log
      - name: Verify package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, plistlib, shutil, hashlib, os
          packages=list(Path('packages').glob('*.deb')); assert len(packages)==1, packages
          deb=packages[0]
          assert subprocess.check_output(['dpkg-deb','-f',str(deb),'Version'],text=True).strip()==os.environ['DELIVERY_VERSION']
          dest=Path('_unpacked'); subprocess.run(['dpkg-deb','-x',str(deb),str(dest)],check=True)
          assert len(list(dest.rglob('KZTheme.dylib')))==1
          assert len(list(dest.rglob('KZThemePrefs.bundle')))==1
          assert len(list(dest.rglob('lead.caml')))==1
          out=Path('_delivery'); out.mkdir(exist_ok=True)
          shutil.copy2(deb,out/(os.environ['DELIVERY_VERSION']+'-KZTheme.deb'))
          (out/'BUILD-VERIFICATION.txt').write_text('ok\n')
          files=sorted(out.iterdir())
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KZTheme-${{ env.DELIVERY_VERSION }}
          path: _delivery/*
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KZTheme-${{ env.DELIVERY_VERSION }}-logs
          path: build-output.log
          if-no-files-found: warn